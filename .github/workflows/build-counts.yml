name: Build & Report Counts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-report:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: pip install -e ".[dev]"

    - name: Run tests
      run: pytest tests/ -q

    - name: Build dataset
      run: mhcseqs build

    - name: Report counts
      run: python scripts/report_counts.py

    - name: Enforce release artifact count gates
      run: |
        DATA_DIR="$(python -c 'from mhcseqs.datafiles import resolve_data_dir; print(resolve_data_dir())')"
        python scripts/check_release_artifacts.py \
          "$DATA_DIR/mhc-seqs-raw.csv" \
          "$DATA_DIR/mhc-full-seqs.csv"
