[project]
name = "mhcseqs"
dynamic = ["version"]
description = "MHC sequence curation and binding groove extraction"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "mhcgnomes>=3.41.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]
# The DataFrame loaders (load_raw_dataframe, load_sequences_dataframe,
# load_mhc_protein_dataframe) import pandas when they are called.
pandas = [
    "pandas>=3,<4",
]
docs = [
    "mkdocs>=1.6,<2",
]

[project.scripts]
mhcseqs = "mhcseqs.__main__:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "mhcseqs.version.__version__"}

[tool.setuptools.packages.find]
include = ["mhcseqs*"]

[tool.setuptools.package-data]
mhcseqs = [
    "b2m_sequences.csv",
    "mouse_h2_sequences.csv",
    "diverse_mhc_sequences.csv",
    "genbank_saha_sequences.csv",
    "mhc_prefix_aliases.csv",
    "mhc_protein_datasets.json",
    "sp_boundary_model.json",
    "sp_sequence_cue_model.json",
]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Scripts use sys.path manipulation before importing sibling modules
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
dev-dependencies = [
    "matplotlib>=3.10.8",
]
